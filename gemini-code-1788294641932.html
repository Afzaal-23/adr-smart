<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>ADR-Smart · Adverse Drug Reaction Report</title>

<meta name="description" content="ADR-SMART multilingual adverse drug reaction reporting form">
<style>
  .offline-pill{font-size:11px;color:var(--ink-soft);margin:10px 0 0;text-align:center}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2624;
    --ink-soft:#54615C;
    --ink-faint:#8B948F;
    --paper:#F6F4EE;
    --card:#FFFFFF;
    --line:#DCD8CC;
    --teal:#0F6E56;
    --teal-deep:#085041;
    --teal-tint:#E1F5EE;
    --amber:#BA7517;
    --amber-tint:#FAEEDA;
    --red:#A32D2D;
    --red-tint:#FCEBEB;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.55;
  }
  h1,h2,h3{
    font-family:'Source Serif 4', serif;
    font-weight:600;
    margin:0 0 6px;
    color:var(--ink);
  }
  .shell{max-width:640px; margin:0 auto; padding:28px 20px 80px;}
  .brandbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:34px; height:34px; border-radius:8px; background:var(--teal); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;}
  .brand-mark svg{width:18px; height:18px; stroke:#fff;}
  .brand-name{font-family:'Source Serif 4', serif; font-weight:600; font-size:17px;}
  .qr-tag{font-size:12px; color:var(--ink-faint); border:0.5px solid var(--line); padding:4px 10px; border-radius:20px; white-space:nowrap;}

  .progress-track{height:3px; background:var(--line); border-radius:2px; margin-bottom:6px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--teal); transition:width .35s ease;}
  .progress-label{font-size:12px; color:var(--ink-faint); margin-bottom:22px;}

  .card{background:var(--card); border:0.5px solid var(--line); border-radius:var(--radius); padding:28px 26px;}
  .step-eyebrow{font-size:12px; color:var(--teal-deep); font-weight:500; margin-bottom:4px;}
  .step-sub{color:var(--ink-soft); font-size:14px; margin-bottom:24px;}

  .field{margin-bottom:18px;}
  .field label{display:block; font-size:13px; font-weight:500; color:var(--ink); margin-bottom:6px;}
  .field .hint{font-size:12px; color:var(--ink-faint); margin-top:4px;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; padding:10px 12px; border:0.5px solid var(--line); border-radius:8px;
    font-family:inherit; font-size:14px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--teal); outline-offset:1px; border-color:var(--teal);}
  textarea{resize:vertical; min-height:78px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:480px){.row2{grid-template-columns:1fr;}}

  .lang-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:18px;}
  .lang-btn{
    border:0.5px solid var(--line); background:#fff; border-radius:var(--radius);
    padding:20px 10px; text-align:center; cursor:pointer; font-family:inherit;
  }
  .lang-btn:hover{border-color:var(--teal);}
  .lang-btn.active{border-color:var(--teal); background:var(--teal-tint);}
  .lang-btn .lname{display:block; font-size:15px; font-weight:500; margin-bottom:2px;}
  .lang-btn .lnative{display:block; font-size:13px; color:var(--ink-soft);}

  .choice-group{display:flex; flex-direction:column; gap:8px;}
  .choice{
    display:flex; align-items:flex-start; gap:10px; border:0.5px solid var(--line);
    border-radius:8px; padding:12px 14px; cursor:pointer;
  }
  .choice:hover{border-color:var(--teal);}
  .choice input{margin-top:3px;}
  .choice .ctext{font-size:14px;}
  .choice .csub{font-size:12px; color:var(--ink-faint); margin-top:2px;}
  .choice.checked{border-color:var(--teal); background:var(--teal-tint);}

  .severity-row{display:flex; gap:10px;}
  .sev-opt{flex:1; text-align:center; border:0.5px solid var(--line); border-radius:8px; padding:12px 6px; cursor:pointer; font-size:13px; font-weight:500;}
  .sev-opt.checked-mild{border-color:var(--teal); background:var(--teal-tint); color:var(--teal-deep);}
  .sev-opt.checked-mod{border-color:var(--amber); background:var(--amber-tint); color:var(--amber);}
  .sev-opt.checked-sev{border-color:var(--red); background:var(--red-tint); color:var(--red);}

  .flag-banner{margin-top:16px; padding:12px 14px; border-radius:8px; font-size:13px; display:none;}
  .flag-banner.show{display:block;}
  .flag-serious{background:var(--red-tint); color:var(--red); border:0.5px solid var(--red);}
  .flag-notserious{background:var(--teal-tint); color:var(--teal-deep); border:0.5px solid var(--teal);}

  .summary-block{margin-bottom:16px;}
  .summary-block h3{font-size:14px; color:var(--teal-deep); margin-bottom:8px;}
  .summary-row{display:flex; justify-content:space-between; gap:12px; font-size:13px; padding:6px 0; border-bottom:0.5px solid var(--line);}
  .summary-row .k{color:var(--ink-soft);}
  .summary-row .v{text-align:right; font-weight:500;}

  .nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:26px;}
  button.primary, button.secondary{
    font-family:inherit; font-size:14px; font-weight:500; padding:11px 22px; border-radius:8px;
    cursor:pointer; border:0.5px solid transparent;
  }
  button.primary{background:var(--teal); color:#fff;}
  button.primary:hover{background:var(--teal-deep);}
  button.secondary{background:transparent; color:var(--ink-soft); border-color:var(--line);}
  button.secondary:hover{border-color:var(--ink-faint);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  .err{color:var(--red); font-size:12px; margin-top:6px; display:none;}
  .err.show{display:block;}

  .confirm-wrap{text-align:center; padding:20px 0 6px;}
  .confirm-icon{width:56px; height:56px; border-radius:50%; background:var(--teal-tint); display:flex; align-items:center; justify-content:center; margin:0 auto 18px;}
  .confirm-icon svg{width:26px; height:26px; stroke:var(--teal-deep);}
  .report-id{font-family:'IBM Plex Sans', sans-serif; font-size:20px; font-weight:600; letter-spacing:0.5px; color:var(--teal-deep); margin:14px 0 4px;}
</style>
</head>

/* ---------- state ---------- */
let state = {
  lang: null,
  step: 0,
  data: {
    reporterName:"", reporterRole:"", patientInitials:"", patientAge:"", patientSex:"", weight:"",
    reactionDesc:"", onsetDate:"", reportDate:"", outcome:"",
    drugName:"", dose:"", route:"", indication:"", startDate:"", stopDate:"", batchNo:"",
    severity:"",
    seriousness: { s1:false, s2:false, s3:false, s4:false, s5:false, s6:false }
  },
  reportId:null
};

function t(key){ return T[state.lang || "en"][key]; }

function updateProgress(){
  const total = 7;
  const idx = Math.min(state.step, total);
  const pct = state.step === 0 ? 8 : Math.round((idx/total)*100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent =
    state.step === 0 ? "" :
    state.step === 7 ? "" :
    `Step ${state.step} of 7`;
}

function goTo(step){ state.step = step; render(); window.scrollTo({top:0, behavior:"smooth"}); }

function setLang(code){
  state.lang = code;
  document.getElementById("qrTag").textContent =
    code==="hi" ? "क्यूआर द्वारा स्कैन" : code==="mr" ? "क्यूआर द्वारे स्कॅन" : "Scanned via QR";
  goTo(1);
}

/* ---------- validation ---------- */
function required(step){
  const d = state.data;
  if(step===1) return d.reporterName && d.patientAge && d.patientSex;
  if(step===2) return d.reactionDesc && d.onsetDate && d.outcome;
  if(step===3) return d.drugName && d.route;
  if(step===4) return d.severity;
  return true;
}

function tryNext(step, nextStep){
  if(!required(step)){
    document.getElementById("errBox").classList.add("show");
    return;
  }
  goTo(nextStep);
}

/* ---------- field binding ---------- */
function bind(id, path){
  const el = document.getElementById(id);
  el.value = state.data[path] || "";
  el.addEventListener("input", e => { state.data[path] = e.target.value; });
}

/* ---------- render ---------- */
function render(){
  updateProgress();
  const root = document.getElementById("cardRoot");
  const s = state.step;

  if(s===0){
    root.innerHTML = `
      <h2>Report an adverse drug reaction</h2>
      <div class="step-sub">Choose a language to continue.</div>
      
<div class="qr-panel" style="margin:18px 0 14px;padding:18px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center;">
  <div style="font-weight:700;font-size:14px;margin-bottom:4px;">Scan to open ADR-SMART</div>
  <div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">This QR automatically encodes the current deployed form URL.</div>
  <div id="qrBox" style="display:inline-flex;align-items:center;justify-content:center;min-width:220px;min-height:220px;background:#fff;border-radius:8px;"></div>
  <div id="qrUrl" style="font-size:10px;color:var(--ink-soft);margin-top:8px;word-break:break-all;"></div>
  <button type="button" class="btn secondary" style="margin-top:10px;" onclick="printQR()">Print / Save QR Poster</button>
</div>
<div class="lang-grid">
        ${Object.entries(LANGS).map(([code,l])=>`
          <div class="lang-btn" onclick="setLang('${code}')">
            <span class="lname">${l.label}</span>
            <span class="lnative">${l.native}</span>
          </div>`).join("")}
      </div>`;
    renderRealQR();
    return;
  }

  if(s===1){
    root.innerHTML = `
      <div class="step-eyebrow">1 / 7</div>
      <h2>${t('step_basic')}</h2>
      <div class="step-sub">${t('step_basic_sub')}</div><div class="hint" style="margin-bottom:18px;">${t('privacyNote')}</div>
      <div class="field"><label>${t('reporterName')} *</label><input id="f_reporterName" type="text"></div>
      <div class="field"><label>${t('reporterRole')}</label><input id="f_reporterRole" type="text" placeholder="Doctor / Nurse / Pharmacist"></div>
      <div class="row2">
        <div class="field"><label>${t('patientInitials')}</label><input id="f_patientInitials" type="text"></div>
        <div class="field"><label>${t('patientAge')} *</label><input id="f_patientAge" type="number" min="0"></div>
      </div>
      <div class="row2">
        <div class="field"><label>${t('patientSex')} *</label>
          <select id="f_patientSex">
            <option value="">—</option>
            <option value="male">${t('male')}</option>
            <option value="female">${t('female')}</option>
            <option value="other">${t('other')}</option>
          </select>
        </div>
        <div class="field"><label>${t('weight')}</label><input id="f_weight" type="number" min="0"></div>
      </div>
      <div class="err" id="errBox">${t('reqErr')}</div>
      <div class="nav-row">
        <span></span>
        <button class="primary" onclick="tryNext(1,2)">${t('next')}</button>
      </div>`;
    bind("f_reporterName","reporterName"); bind("f_reporterRole","reporterRole");
    bind("f_patientInitials","patientInitials"); bind("f_patientAge","patientAge");
    bind("f_weight","weight");
    document.getElementById("f_patientSex").value = state.data.patientSex;
    document.getElementById("f_patientSex").addEventListener("change", e=>state.data.patientSex=e.target.value);
    return;
  }

  if(s===2){
    root.innerHTML = `
      <div class="step-eyebrow">2 / 7</div>
      <h2>${t('step_adr')}</h2>
      <div class="step-sub">${t('step_adr_sub')}</div>
      <div class="field"><label>${t('reactionDesc')} *</label><textarea id="f_reactionDesc"></textarea></div>
      <div class="row2">
        <div class="field"><label>${t('onsetDate')} *</label><input id="f_onsetDate" type="date" max="${getToday()}"></div>
        <div class="field"><label>${t('reportDate')}</label><input id="f_reportDate" type="date"></div>
      </div>
      <div class="field"><label>${t('outcome')} *</label>
        <select id="f_outcome">
          <option value="">—</option>
          <option value="recovered">${t('recovered')}</option>
          <option value="recovering">${t('recovering')}</option>
          <option value="notRecovered">${t('notRecovered')}</option>
          <option value="fatal">${t('fatal')}</option>
          <option value="unknown">${t('unknown')}</option>
        </select>
      </div>
      <div class="err" id="errBox">${t('reqErr')}</div>
      <div class="nav-row">
        <button class="secondary" onclick="goTo(1)">${t('back')}</button>
        <button class="primary" onclick="tryNext(2,3)">${t('next')}</button>
      </div>`;
    bind("f_reactionDesc","reactionDesc"); bind("f_onsetDate","onsetDate"); bind("f_reportDate","reportDate"); if(!state.data.reportDate){state.data.reportDate=getToday(); document.getElementById("f_reportDate").value=state.data.reportDate;}
    document.getElementById("f_outcome").value = state.data.outcome;
    document.getElementById("f_outcome").addEventListener("change", e=>state.data.outcome=e.target.value);
    return;
  }

  if(s===3){
    root.innerHTML = `
      <div class="step-eyebrow">3 / 7</div>
      <h2>${t('step_drug')}</h2>
      <div class="step-sub">${t('step_drug_sub')}</div>
      <div class="field"><label>${t('drugName')} *</label><input id="f_drugName" type="text"></div>
      <div class="row2">
        <div class="field"><label>${t('dose')}</label><input id="f_dose" type="text" placeholder="e.g. 500mg twice daily"></div>
        <div class="field"><label>${t('route')} *</label>
          <select id="f_route">
            <option value="">${t('routeSel')}</option>
            <option value="oral">${t('oral')}</option>
            <option value="iv">${t('iv')}</option>
            <option value="im">${t('im')}</option>
            <option value="topical">${t('topical')}</option>
            <option value="other">${t('other2')}</option>
          </select>
        </div>
      </div>
      <div class="field"><label>${t('indication')}</label><input id="f_indication" type="text"></div>
      <div class="row2">
        <div class="field"><label>${t('startDate')}</label><input id="f_startDate" type="date"></div>
        <div class="field"><label>${t('stopDate')}</label><input id="f_stopDate" type="date"></div>
      </div>
      <div class="field"><label>${t('batchNo')}</label><input id="f_batchNo" type="text"></div>
      <div class="err" id="errBox">${t('reqErr')}</div>
      <div class="nav-row">
        <button class="secondary" onclick="goTo(2)">${t('back')}</button>
        <button class="primary" onclick="tryNext(3,4)">${t('next')}</button>
      </div>`;
    bind("f_drugName","drugName"); bind("f_dose","dose"); bind("f_indication","indication");
    bind("f_startDate","startDate"); bind("f_stopDate","stopDate"); bind("f_batchNo","batchNo");
    document.getElementById("f_route").value = state.data.route;
    document.getElementById("f_route").addEventListener("change", e=>state.data.route=e.target.value);
    return;
  }

  if(s===4){
    const sev = state.data.severity;
    root.innerHTML = `
      <div class="step-eyebrow">4 / 7</div>
      <h2>${t('step_severity')}</h2>
      <div class="step-sub">${t('step_severity_sub')}</div>
      <div class="field">
        <div class="severity-row">
          <div class="sev-opt ${sev==='mild'?'checked-mild':''}" onclick="setSeverity('mild')">${t('mild')}</div>
          <div class="sev-opt ${sev==='moderate'?'checked-mod':''}" onclick="setSeverity('moderate')">${t('moderate')}</div>
          <div class="sev-opt ${sev==='severe'?'checked-sev':''}" onclick="setSeverity('severe')">${t('severe')}</div>
        </div>
      </div>
      <div class="hint" style="margin-top:10px;">${t('severityNote')}</div>
      <div class="err" id="errBox">${t('reqErr')}</div>
      <div class="nav-row">
        <button class="secondary" onclick="goTo(3)">${t('back')}</button>
        <button class="primary" onclick="tryNext(4,5)">${t('next')}</button>
      </div>`;
    return;
  }

  if(s===5){
    const sr = state.data.seriousness;
    const items = ["s1","s2","s3","s4","s5","s6"];
    const anyChecked = items.some(k=>sr[k]);
    root.innerHTML = `
      <div class="step-eyebrow">5 / 7</div>
      <h2>${t('step_seriousness')}</h2>
      <div class="step-sub">${t('step_seriousness_sub')}</div>
      <div class="choice-group">
        ${items.map(k=>`
          <label class="choice ${sr[k]?'checked':''}">
            <input type="checkbox" ${sr[k]?'checked':''} onchange="toggleSeriousness('${k}')">
            <span class="ctext">${t(k)}</span>
          </label>`).join("")}
      </div>
      <div class="flag-banner ${anyChecked? 'show flag-serious':'show flag-notserious'}" id="flagBanner">
        ${anyChecked ? t('flagSerious') : t('flagNotSerious')}
      </div>
      <div class="nav-row">
        <button class="secondary" onclick="goTo(4)">${t('back')}</button>
        <button class="primary" onclick="goTo(6)">${t('next')}</button>
      </div>`;
    return;
  }

  if(s===6){
    const d = state.data;
    const sexLabel = d.patientSex ? t(d.patientSex) : "—";
    const outcomeLabel = d.outcome ? t(d.outcome) : "—";
    const routeLabel = d.route ? (d.route==='other'? t('other2') : t(d.route)) : "—";
    const sevLabel = d.severity ? t(d.severity) : "—";
    const flags = ["s1","s2","s3","s4","s5","s6"].filter(k=>d.seriousness[k]).map(k=>t(k));
    root.innerHTML = `
      <div class="step-eyebrow">6 / 7</div>
      <h2>${t('step_review')}</h2>
      <div class="step-sub">${t('step_review_sub')}</div>

      <div class="summary-block">
        <h3>${t('reviewReporter')}</h3>
        <div class="summary-row"><span class="k">${t('reporterName')}</span><span class="v">${escapeHTML(d.reporterName||"—")}</span></div>
        <div class="summary-row"><span class="k">${t('patientAge')} / ${t('patientSex')}</span><span class="v">${escapeHTML(d.patientAge||"—")} / ${escapeHTML(sexLabel)}</span></div>
      </div>

      <div class="summary-block">
        <h3>${t('reviewAdr')}</h3>
        <div class="summary-row"><span class="k">${t('reactionDesc')}</span><span class="v">${escapeHTML(d.reactionDesc||"—")}</span></div>
        <div class="summary-row"><span class="k">${t('onsetDate')}</span><span class="v">${escapeHTML(d.onsetDate||"—")}</span></div>
        <div class="summary-row"><span class="k">${t('outcome')}</span><span class="v">${escapeHTML(outcomeLabel)}</span></div>
      </div>

      <div class="summary-block">
        <h3>${t('reviewDrug')}</h3>
        <div class="summary-row"><span class="k">${t('drugName')}</span><span class="v">${escapeHTML(d.drugName||"—")}</span></div>
        <div class="summary-row"><span class="k">${t('route')}</span><span class="v">${escapeHTML(routeLabel)}</span></div>
      </div>

      <div class="summary-block">
        <h3>${t('reviewScreen')}</h3>
        <div class="summary-row"><span class="k">${t('step_severity')}</span><span class="v">${escapeHTML(sevLabel)}</span></div>
        <div class="summary-row"><span class="k">${t('step_seriousness')}</span><span class="v">${escapeHTML(flags.length? flags.join(", ") : "—")}</span></div>
      </div>

      <div class="nav-row">
        <button class="secondary" onclick="goTo(5)">${t('back')}</button>
        <button class="primary" onclick="submitReport()">${t('submit')}</button>
      </div>`;
    return;
  }

  if(s===7){
    const reports = JSON.parse(localStorage.getItem("adrSmartReports") || "[]");
    const thisReport = reports.find(r=>r.reportId===state.reportId);
    const synced = thisReport && thisReport.syncStatus === "synced";
    root.innerHTML = `
      <div class="confirm-wrap">
        <div class="confirm-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
        <h2>${t('confirmTitle')}</h2>
        <div class="step-sub">${t('confirmSub')}</div>
        <div class="report-id">${t('reportIdLabel')}: ${state.reportId}</div>
      </div>
      <div class="summary-block" style="margin-top:10px;">
        <div class="summary-row"><span class="k">Saved to your device</span><span class="v">✅ Yes (your personal copy / receipt)</span></div>
        <div class="summary-row"><span class="k">Sent to central admin storage</span>
          <span class="v">${CONFIG.ADMIN_ENDPOINT_URL ? (synced ? "✅ Synced" : "⏳ Queued, will retry") : "⚠️ Not configured yet"}</span></div>
      </div>
      <div class="nav-row" style="justify-content:center; margin-top:20px;">
        <button class="primary" onclick="resetForm()">${t('newReport')}</button>
      </div>`;
    return;
  }
}

function setSeverity(v){ state.data.severity = v; render(); }
function toggleSeriousness(k){ state.data.seriousness[k] = !state.data.seriousness[k]; render(); }

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

function saveReportLocally(record){
  const reports = JSON.parse(localStorage.getItem("adrSmartReports") || "[]");
  reports.push(record);
  localStorage.setItem("adrSmartReports", JSON.stringify(reports));
}

function updateLocalSyncStatus(reportId, status){
  const reports = JSON.parse(localStorage.getItem("adrSmartReports") || "[]");
  const r = reports.find(x=>x.reportId===reportId);
  if(r){ r.syncStatus = status; localStorage.setItem("adrSmartReports", JSON.stringify(reports)); }
}

function queueForCentralSync(record){
  const queue = JSON.parse(localStorage.getItem("adrSmartCentralQueue") || "[]");
  queue.push(record);
  localStorage.setItem("adrSmartCentralQueue", JSON.stringify(queue));
}

async function pushToCentral(record){
  if(!CONFIG.ADMIN_ENDPOINT_URL) return false;
  try{
    const res = await fetch(CONFIG.ADMIN_ENDPOINT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ key: CONFIG.ADMIN_SHARED_KEY, record })
    });
    return res.ok;
  }catch(err){
    console.warn("Central sync failed, will retry later:", err);
    return false;
  }
}

async function flushCentralQueue(){
  if(!CONFIG.ADMIN_ENDPOINT_URL) return;
  let queue = JSON.parse(localStorage.getItem("adrSmartCentralQueue") || "[]");
  if(!queue.length) return;
  const remaining = [];
  for(const record of queue){
    const ok = await pushToCentral(record);
    if(ok){ updateLocalSyncStatus(record.reportId, "synced"); }
    else{ remaining.push(record); }
  }
  localStorage.setItem("adrSmartCentralQueue", JSON.stringify(remaining));
  renderSyncBadge();
}

function pendingSyncCount(){
  return JSON.parse(localStorage.getItem("adrSmartCentralQueue") || "[]").length;
}

function renderSyncBadge(){
  const el = document.getElementById("offlineStatus");
  if(!el) return;
  const pending = pendingSyncCount();
  const base = navigator.onLine
    ? "Online • A copy is saved on this device."
    : "Offline • A copy is saved on this device.";
  const centralPart = !CONFIG.ADMIN_ENDPOINT_URL
    ? " Central storage is not yet configured."
    : pending>0
      ? ` ${pending} report(s) waiting to sync to central storage.`
      : " All reports are synced to central storage.";
  el.textContent = base + centralPart;
}

function getToday(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

async function submitReport(){
  const now = new Date();
  const rand = Math.floor(1000 + Math.random()*9000);
  state.reportId = `ADR-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}-${rand}`;
  if(!state.data.reportDate) state.data.reportDate = getToday();

  const record = {
    reportId: state.reportId,
    language: state.lang,
    data: JSON.parse(JSON.stringify(state.data)),
    submittedAt: new Date().toISOString(),
    syncStatus: "pending"
  };

  saveReportLocally(record);
  queueForCentralSync(record);

  if(navigator.onLine && CONFIG.ADMIN_ENDPOINT_URL){
    const ok = await pushToCentral(record);
    if(ok){
      updateLocalSyncStatus(state.reportId, "synced");
      const q = JSON.parse(localStorage.getItem("adrSmartCentralQueue") || "[]").filter(r=>r.reportId!==state.reportId);
      localStorage.setItem("adrSmartCentralQueue", JSON.stringify(q));
    }
  }

  goTo(7);
}

function resetForm(){
  state.step = 1;
  state.data = {
    reporterName:"", reporterRole:"", patientInitials:"", patientAge:"", patientSex:"", weight:"",
    reactionDesc:"", onsetDate:"", reportDate:"", outcome:"",
    drugName:"", dose:"", route:"", indication:"", startDate:"", stopDate:"", batchNo:"",
    severity:"",
    seriousness: { s1:false, s2:false, s3:false, s4:false, s5:false, s6:false }
  };
  state.reportId = null;
  render();
}

function updateOfflineStatus(){
  renderSyncBadge();
  if(navigator.onLine) flushCentralQueue();
}
window.addEventListener("online", updateOfflineStatus);
window.addEventListener("offline", updateOfflineStatus);
updateOfflineStatus();
if(navigator.onLine) flushCentralQueue();
render();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
function renderRealQR(){
  const box = document.getElementById("qrBox");
  const urlEl = document.getElementById("qrUrl");
  if(!box) return;
  box.innerHTML = "";
  const target = window.location.href.split("#")[0];
  if(/^https?:/i.test(target)){
    new QRCode(box, {
      text: target,
      width: 210,
      height: 210,
      correctLevel: QRCode.CorrectLevel.M
    });
    if(urlEl) urlEl.textContent = target;
  } else {
    box.innerHTML = '<div style="padding:20px;font-size:12px;color:#8a4b00;">Deploy this HTML on an HTTPS website to activate the real scannable QR.</div>';
  }
}
function printQR(){
  window.print();
}
window.addEventListener("load", renderRealQR);
</script>
<style>
@media print{
  body > *:not(#app){display:none!important}
  .qr-panel{page-break-inside:avoid}
}
</style>

</body>
